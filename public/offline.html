<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Fresh Price</title>
    <style>
      :root { --bg: #f6f7f4; --text: #17201a; --muted: #5d6b61; --brand: #2f7d32; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0f1411; --text: #e7ede8; --muted: #9aa99f; --brand: #5cb860; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text);
             font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
      main { max-width: 22rem; text-align: center; }
      h1 { font-size: 1.5rem; margin: 16px 0 8px; }
      p { color: var(--muted); line-height: 1.5; }
      button { margin-top: 16px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: var(--brand);
               color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" width="64" height="64" alt="" />
      <h1>You’re offline</h1>
      <p>Fresh Price needs a connection to load today’s prices and save calculations, so figures are always current.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
